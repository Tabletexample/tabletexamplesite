<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Upload Example</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; text-align: center; }
        .upload-container { border: 2px dashed #ccc; padding: 30px; border-radius: 8px; display: inline-block; }
        #status { margin-top: 20px; font-weight: bold; color: green; }
    </style>
</head>
<body>

    <h1>Upload Your PDF Document</h1>
    <div class="upload-container">
        <!-- Accept restricted to only PDF files -->
        <input type="file" id="pdfInput" accept=".pdf" />
        <br><br>
        <button onclick="uploadPDF()">Upload PDF</button>
    </div>

    <div id="status"></div>

    <script>
        async function uploadPDF() {
            const fileInput = document.getElementById('pdfInput');
            const statusDiv = document.getElementById('status');
            
            if (fileInput.files.length === 0) {
                statusDiv.style.color = "red";
                statusDiv.innerText = "Please select a PDF file first.";
                return;
            }

            const file = fileInput.files[0];
            statusDiv.style.color = "blue";
            statusDiv.innerText = "Uploading... Please wait.";

            // Using standard FormData to send file to an anonymous API
            const formData = new FormData();
            formData.append('file', file);

            try {
                // Free public upload endpoint example (tmpfiles.org)
                const response = await fetch('https://tmpfiles.org', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    // Extracting the downloadable link from the API response
                    const fileUrl = data.data.url;
                    statusDiv.style.color = "green";
                    statusDiv.innerHTML = `Upload successful! <br><a href="${fileUrl}" target="_blank">View Uploaded PDF</a>`;
                } else {
                    throw new Error('Upload failed.');
                }
            } catch (error) {
                statusDiv.style.color = "red";
                statusDiv.innerText = "Error uploading file. Please try again.";
                console.error(error);
            }
        }
    </script>

</body>
</html>
